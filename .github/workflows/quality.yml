name: Quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-quality:
    name: Package and docs quality checks
    runs-on: ubuntu-latest
    # Headroom for the NestJS 11 reinstall before the CommonJS check.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        # The docs site is not packaged: CI's check job already builds it.
        run: pnpm turbo run build --filter='!docs'

      - name: Validate package manifests
        run: pnpm publint

      - name: Dry-run npm packaging
        run: pnpm pack:dry-run

      - name: Validate type resolution (attw)
        run: pnpm attw

      # Every symbol a collector package exports is public API under semver, so it must be
      # listed in its "Public exports" section — an unlisted export is either accidental or
      # undocumented, and removing it after a release costs a major.
      - name: Verify documented public exports
        run: pnpm check:api-exports

      # The ESM build is what an ESM application imports: it must load without require(esm) and
      # without pulling in the CommonJS build alongside. NestJS 12, installed by default, is the
      # case it exists for: its packages are ESM.
      - name: Verify the packages can be imported from ESM
        run: pnpm check:esm-import

      # NestJS 12 itself ships ESM only, so a CommonJS app on it already relies on Node's
      # require(esm). The strict check below is only meaningful against CommonJS peers: run it
      # with NestJS 11 installed (the built `dist/` stays as is).
      - name: Switch to NestJS 11 for the CommonJS check
        run: pnpm nestjs:use 11 && pnpm install --no-frozen-lockfile

      # The packages ship CommonJS, so a value import of an ESM-only dependency compiles to a
      # `require()` Node refuses — invisible to the compiler, to the unit tests (CommonJS on both
      # sides) and to the e2e suite (which runs as ESM), and fatal in a deployed CommonJS app.
      - name: Verify the packages can be required from CommonJS
        run: pnpm check:cjs-require

      - name: Verify the packages can be imported from ESM on NestJS 11
        run: pnpm check:esm-import

  skill-references:
    name: Skill references in sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The add-nest-profiler-collector skill bundles generated copies of the
      # collectors-*.md references. Fail if they drift from their single source
      # (setup-nest-profiler/references) — run `pnpm sync:skill-refs` to fix.
      - name: Verify skill references are in sync
        run: pnpm sync:skill-refs:check
