name: Repository config

# Syncs the *recurring* repository config (labels) from a declarative file.
# The one-time config (branch ruleset, repo settings, Actions variables,
# CODEOWNERS, npm trusted publisher) is applied manually — see MAINTAINERS.md.

on:
  push:
    branches: ['main']
    paths:
      - '.github/labels.yml'
  workflow_dispatch:
    inputs:
      prune-labels:
        description: 'Delete labels that are not declared in .github/labels.yml'
        type: boolean
        default: false

permissions:
  issues: write

concurrency:
  group: repo-config-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-labels:
    name: Sync labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Sync labels from .github/labels.yml
        uses: crazy-max/ghaction-github-labeler@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          yaml-file: .github/labels.yml
          # Pruning (deleting undeclared labels) only on an explicit manual run.
          skip-delete: ${{ !(github.event_name == 'workflow_dispatch' && inputs.prune-labels) }}
          dry-run: false
