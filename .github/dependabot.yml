version: 2

# One grouped PR per ecosystem and per week. When a single dependency breaks the
# group, comment `@dependabot ignore <name>` on the PR to regenerate it without
# that dependency instead of splitting the group.
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      time: '08:00'
      timezone: 'Europe/Paris'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'github-actions'
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      time: '08:00'
      timezone: 'Europe/Paris'
    # Keep the declared ranges (^x.y.z) as long as the new version satisfies them:
    # minor/patch updates only touch the lockfile. A published range only moves
    # when it has to, and that change then needs a changeset.
    versioning-strategy: 'increase-if-necessary'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore'
      include: 'scope'
    # Supply-chain guard: skip releases younger than a week. Security updates
    # are not delayed by the cooldown.
    cooldown:
      default-days: 7
    labels:
      - 'dependencies'
    ignore:
      # @types/node tracks the lowest supported Node major (engines.node).
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
    groups:
      # Majors stay out of the group: one PR each, never auto-merged.
      npm:
        applies-to: 'version-updates'
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

      security:
        applies-to: 'security-updates'
        patterns:
          - '*'
