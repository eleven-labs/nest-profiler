packages:
  - 'packages/*'
  - 'packages/configs/*'
  - 'examples/*'
  - 'docs'

# Security overrides — see https://github.com/eleven-labs/nest-profiler/security/dependabot
# Each entry pins a transitive dependency to its first patched version.
overrides:
  # GHSA-wc9g-mqfw-jrwm, GHSA-qfvm-cv95-jqjf, GHSA-qvfw-j98x-7q72, GHSA-535w-7cp7-47q4 (via @nestjs/platform-express)
  multer@^2.0.0: '>=2.3.0'
  # GHSA-2883-xcg3-v3hh (via jest / @commitlint)
  js-yaml@^4.0.0: '>=4.3.2'
  # GHSA-4mjr-xmp4-gh2g, GHSA-x5fp-wj9c-mxmx (via express / body-parser)
  qs@^6.0.0: '>=6.16.0'
  # GHSA-v422-hmwv-36x6 (via @apollo/server)
  body-parser@^2.0.0: '>=2.3.0'
  # GHSA-jqff-g426-hqxp, GHSA-f65p-4m7j-42xc, GHSA-5jgf-p345-68v8, GHSA-fph4-wmhf-6fwf, GHSA-7p8r-x3mc-p8w7, GHSA-v2hh-gcrm-f6hx
  fast-uri@^2.0.0: '>=2.4.5'
  fast-uri@^3.0.0: '>=3.1.6'
  fast-uri@^4.0.0: '>=4.1.3'
  # GHSA-w2qp-rph6-63g4, GHSA-3m5p-2c4r-xxw2 (via @nestjs/platform-fastify / @nestjs/mercurius)
  fastify@^5.0.0: '>=5.12.1'
  # GHSA-c96f-x56v-gq3h (via fastify)
  find-my-way@^9.0.0: '>=9.7.0'
  # GHSA-rgw5-rvv9-x895, GHSA-mh99-v99m-4gvg (via minimatch@3)
  brace-expansion@^1.0.0: '>=1.1.18'

allowBuilds:
  '@apollo/protobufjs': true
  '@parcel/watcher': true
  '@scarf/scarf': false
  better-sqlite3: true
  esbuild: true
  sharp: true
  unrs-resolver: true
